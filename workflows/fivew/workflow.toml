# Workflow E (plans/workflow-e-5w-plan.md): a response's 5W on the Hurricane Melissa form's model.

requires = ["responses"]
# The CSO mapping is another project, on its own instance: both write an organisation's
# Account's teams (plans/fivew-organisations-plan.md)
conflicts = ["cso"]
agent_guarded = ["CResponder"]
task_parents = ["CResponder"]
codes = { CResponder = "REG", CActivity = "ACT" }
agent_entities = { CResponder = "Responding organisation", CActivity = "Activity" }
links = [
  ["CResponse", "responders", "CResponder", "response", "oneToMany"],
  ["CResponder", "account", "Account", "responderProfiles", "manyToOne"],
  ["CActivity", "account", "Account", "fivewActivities", "manyToOne"],
  ["CActivityLocation", "account", "Account", "fivewLocations", "manyToOne"],
  ["CResponder", "contact", "Contact", "responderProfiles", "manyToOne"],
  ["CResponder", "activities", "CActivity", "responder", "oneToMany"],
  ["CProject", "activities", "CActivity", "project", "oneToMany"],
  ["CResponse", "activities", "CActivity", "response", "oneToMany"],
  ["CResponder", "organisation", "COrganisation", "registrations", "manyToOne"],
  ["CActivity", "leadOrganisation", "COrganisation", "activitiesLed", "manyToOne"],
  ["CActivity", "implementingOrganisation", "COrganisation", "activitiesImplemented", "manyToOne"],
  ["CActivity", "locations", "CActivityLocation", "activity", "oneToMany"],
  ["CActivity", "focalPoints", "CFocalPoint", "activity", "oneToMany"],
  ["CFocalPoint", "account", "Account", "activityFocalPoints", "manyToOne"],
  ["CFocalPoint", "contact", "Contact", "activityFocalPoints", "manyToOne"],
