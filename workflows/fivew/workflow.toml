# An organisation's people: Contacts on its Account (its registrations' focal points, one
# per person and organisation by email), in its Account's teams (traits), active or not
[fields.Contact]
active = { type = "bool", label = "Active", default = true, tooltipText = "Still one of the organisation's people for the response: unticked, they're kept, and left out of the contact list" }
shared = { type = "bool", label = "Shared", tooltipText = "May be shown to other organisations (a directory), not only to the coordinators" }

[layouts.Contact]
detail = [["account", "title", "cActive", "cShared"]]
relationships = [{ name = "activityFocalPoints", before = "cases" }]

[layouts.CResponder]
detail = [
  ["response", "organisation", "organisationOther", "account", "acronym", "orgType", "clusters", "status", "focalPoint", "contact", "focalPointPhone", "lastReport", "registrationKey"],
]
list = ["name", "code", "organisation", "clusters", "status", "lastReport", "response"]
relationships = ["activities", "tasks"]

[layouts.CActivity]
detail = [
  ["response", "project", "leadOrganisation", "leadOrganisationOther", "account", "implementingOrganisation", "implementingOrganisationOther", "responder", "sector", "sectorOther", "activityType", "activityTypeOther", "title", "status", "startDate", "endDate", "reportDate", "resourceType", "resourceTypeOther", "resourceUnit", "resourceUnitOther", "comments", "resourceUrl"],
  ["communities", "quantity", "budget", "peopleTargeted", "peopleReached", "dataChecks"],
]
list = [
  "name",
  "code",
  "leadOrganisation",
  "sector",
  "activityType",
  "status",
  "communities",
  "peopleReached",
  "startDate",
  "dataChecks",
]
relationships = ["locations", "focalPoints"]

[layouts.CActivityLocation]
detail = [
  ["activity", "account", "project", "response", "parish", "community", "site", "locationType", "locationTypeOther", "locationComments", "quantity", "budget", "populationTargeted", "populationReached", "populationGroups", "populationGroupsOther", "dataChecks"],
  ["idpPeopleTargeted", "idpWomenTargeted", "idpMenTargeted", "idpChildrenTargeted", "idpHouseholdsTargeted", "idpPeopleReached", "idpWomenReached", "idpMenReached", "idpChildrenReached", "idpHouseholdsReached", "hostingPeopleTargeted", "hostingWomenTargeted", "hostingMenTargeted", "hostingChildrenTargeted", "hostingHouseholdsTargeted", "hostingPeopleReached", "hostingWomenReached", "hostingMenReached", "hostingChildrenReached", "hostingHouseholdsReached", "ndpPeopleTargeted", "ndpWomenTargeted", "ndpMenTargeted", "ndpChildrenTargeted", "ndpHouseholdsTargeted", "ndpPeopleReached", "ndpWomenReached", "ndpMenReached", "ndpChildrenReached", "ndpHouseholdsReached", "otherPeopleTargeted", "otherWomenTargeted", "otherMenTargeted", "otherChildrenTargeted", "otherHouseholdsTargeted", "otherPeopleReached", "otherWomenReached", "otherMenReached", "otherChildrenReached", "otherHouseholdsReached"],
]
list = ["name", "activity", "parish", "community", "locationType", "populationTargeted", "populationReached"]

[layouts.CFocalPoint]
detail = [["activity"], ["contact", "account"]]
list = ["name", "activity", "contact", "emailAddress", "phone", "jobTitle"]

[layouts.Account]
relationships = [{ name = "responderProfiles", before = "cases" }, { name = "fivewActivities", before = "cases" }]

[layouts.COrganisation]
relationships = ["activitiesLed", "registrations"]

[layouts.CResponse]
relationships = [{ name = "responders", before = "tasks" }]

[layouts.CProject]
relationships = [{ name = "activities", before = "tasks" }]

[layouts.CSite]
relationships = ["activityLocations"]

[[data]]
entity = "COrganisation"
list = "fivew-melissa.organisations"
match = "code"
map = { name = "label", code = "code", orgType = "org_type" }

[removed]
links = [["CActivity", "adminArea"], ["CActivity", "site"]]
[removed.fields]
CActivity = ["girls", "boys", "women", "men", "elderlyWomen", "elderlyMen", "households", "unit"]

# The formulas' shared patterns (espo/traits.py); the pack's own blocks are in formulas/.
# An activity is in its response's project for its sector (its block finds the project
# first), and in that project's teams: the sector's people and the coordinators see it.
# With no project for its sector, it's in the response's teams (coordinators only)
[traits.CActivity]
inherit = [
  { link = "project", entity = "CProject", copy = ["teamsIds", "responseId"] },
  { link = "response", entity = "CResponse", copy = ["teamsIds"], unless = "project" },
]

# Data checks: what looks wrong, as flags for the IM team. Its locations' totals come in
# after it's made (their formula), and the checks follow them
[traits.CActivity.checks]
no_communities = "!communities"
completed_nobody_reached = "status == 'COMPLETED' && communities && !peopleReached"
completed_ends_later = "status == 'COMPLETED' && endDate && datetime\\diff(endDate, datetime\\today(), 'days') > 0"

# A location and a focal point are their activity's: its teams (and a location its project
# and response)
[traits.CActivityLocation]
inherit = [{ link = "activity", entity = "CActivity", copy = ["teamsIds", "projectId", "responseId", "accountId"] }]

[traits.CActivityLocation.checks]
reached_over_targeted = "populationReached && populationTargeted && populationReached > populationTargeted"
groups_over_total = "populationReached && $groups > populationReached"
group_parts_dont_add_up = "$parts"

# A focal point is this person for this activity (the report named them); the person is
# one Contact on the organisation's Account, matched by email, else phone (PRODUCT-439)
[traits.CFocalPoint]
inherit = [{ link = "activity", entity = "CActivity", copy = ["teamsIds", "accountId"], cascade = true }]
find_or_make_contact = { account = "account", email = "emailAddress", phone = "phone", name = "name", title = "jobTitle" }

# A registration is in its response's teams and those of its sectors' projects (and a new
# project's, in its sector). Its organisation's Account (once, whatever the response) is in
# the teams of all the organisation's registrations: each response and cluster sees it
[traits.CResponder]
teams_from_clusters = { clusters = "clusters" }
account_from_organisation = { organisation = "organisation", other = "organisationOther", acronym = "acronym", type = "orgType" }
teams_up = { link = "account", entity = "Account" }

# An organisation's people are in its Account's teams, and follow them (cascade): the
# coordinators and the clusters it's in see them
[traits.Contact]
inherit = [{ link = "account", entity = "Account", copy = ["teamsIds"], cascade = true }]
