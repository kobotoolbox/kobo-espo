Account = { create = "no", read = "team", edit = "team", delete = "no", stream = "team" }
CProject = { create = "no", read = "team", edit = "team", delete = "no", stream = "team" }
Task = { create = "yes", read = "team", edit = "team", delete = "no", stream = "team" }
CResponse = { create = "no", read = "team", edit = "no", delete = "no", stream = "team" }
CFocalPoint = { create = "no", read = "team", edit = "no", delete = "no", stream = "team" }
CClusterContact = { create = "yes", read = "team", edit = "team", delete = "yes", stream = "team" }
CAdminArea = { create = "no", read = "all", edit = "no", delete = "no", stream = "all" }
COrganisation = { create = "no", read = "all", edit = "no", delete = "no", stream = "all" }
Team = { read = "team" }
User = { read = "team" }

[roles."Cluster Partner"]
assignmentPermission = "team"
userPermission = "team"
mentionPermission = "team"
exportPermission = "no"
massUpdatePermission = "no"
[roles."Cluster Partner".data]
Account = { create = "no", read = "team", edit = "no", delete = "no", stream = "team" }
CProject = { create = "no", read = "team", edit = "no", delete = "no", stream = "team" }
Task = { create = "yes", read = "team", edit = "own", delete = "no", stream = "team" }
CResponse = { create = "no", read = "team", edit = "no", delete = "no", stream = "team" }
CFocalPoint = { create = "no", read = "team", edit = "no", delete = "no", stream = "team" }
CClusterContact = { create = "no", read = "team", edit = "no", delete = "no", stream = "team" }
CAdminArea = { create = "no", read = "all", edit = "no", delete = "no", stream = "all" }
COrganisation = { create = "no", read = "all", edit = "no", delete = "no", stream = "all" }
Team = { read = "team" }
User = { read = "team" }

[roles."Cluster Viewer"]
assignmentPermission = "no"
userPermission = "team"
mentionPermission = "team"
exportPermission = "no"
massUpdatePermission = "no"
[roles."Cluster Viewer".data]
Account = { create = "no", read = "team", edit = "no", delete = "no", stream = "team" }
CProject = { create = "no", read = "team", edit = "no", delete = "no", stream = "team" }
Task = { create = "no", read = "team", edit = "no", delete = "no", stream = "team" }
CResponse = { create = "no", read = "team", edit = "no", delete = "no", stream = "team" }
CClusterContact = { create = "no", read = "team", edit = "no", delete = "no", stream = "team" }
CAdminArea = { create = "no", read = "all", edit = "no", delete = "no", stream = "all" }
COrganisation = { create = "no", read = "all", edit = "no", delete = "no", stream = "all" }
Team = { read = "team" }
User = { read = "team" }

[roles."CSO Coordinator"]
[roles."CSO Coordinator".data]
CResponse = { create = "no", read = "team", edit = "no", delete = "no", stream = "team" }

[layouts.CResponse]
detail = [["status", "emergencyType", "country", "lead", "startDate", "endDate"]]
list = ["name", "code", "status", "emergencyType", "country", "lead", "teams"]
relationships = ["projects", "tasks"]

[layouts.CProject]
detail = [["cluster", "sectorKind", "status", "approach", "response", "leadAgency", "coLeads", "lead", "startDate", "endDate"]]
list = ["name", "code", "cluster", "status", "response", "leadAgency", "lead", "teams"]
relationships = ["clusterContacts", "tasks"]

[layouts.CClusterContact]
detail = [["project", "role", "organisation", "organisationOther", "account", "contact", "emailAddress", "phone", "jobTitle"]]
list = ["name", "role", "project", "account", "emailAddress", "phone"]

[layouts.Account]
detail = [["cOrganisation", "cAcronym", "cOrgType"]]
relationships = ["contacts", "clustersLed", "clustersCoLed", "cases", "documents"]

[layouts.Contact]
relationships = ["clusterRoles", "cases", "documents"]

[layouts.COrganisation]
detail = [["orgType"]]
list = ["name", "code", "orgType"]
relationships = ["accounts"]

[layouts.Task]
detail = [["cResponse", "cProject"]]
kanban = [{ name = "cProject", before = "assignedUser" }, { name = "cResponse", before = "assignedUser" }]
filters = ["cResponse", "cProject"]

# A cluster's people: its project's teams (so its response's too), and the project's changes
# follow; each person a Contact on their organisation's Account
[traits.CClusterContact]
inherit = [{ link = "project", entity = "CProject", copy = ["teamsIds"], cascade = true }]
account_from_organisation = { organisation = "organisation", other = "organisationOther" }
find_or_make_contact = { account = "account", email = "emailAddress", phone = "phone", name = "name", title = "jobTitle" }

# A response's teams added or taken off (its country's coordination team, say) follow to its
# projects, and its tasks outside them; the projects' cascades take them further
[traits.CResponse]
teams_down = [{ entity = "CProject", link = "response" }, { entity = "Task", link = "cResponse", unless = "cProject" }]

# A new cluster project: its sector's kind, and its global leads suggested (UNDAC Handbook
# fig. A.4, in the sectors list), unless given
[traits.CProject]
suggest_leads = { list = "fivew-melissa.sectors", by = "cluster", kind = "sectorKind", lead = "leadAgency", co_leads = "coLeads", approach = "approach" }

