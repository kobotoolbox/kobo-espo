# Responses and their cluster projects (plans/espo-kobo-setup-plan.md, Workflow C): teams, leads, starter
# tasks, tasks on the board by project and response. Its lists file is the Melissa 5W form's (sectors).

requires = ["core"]
teams = ["Response: Test EQ 1", "Response: Test EQ 2", "Cluster: Test EQ 1 ETC", "Cluster: Test EQ 1 WASH"]
codes = { CResponse = "RSP", CProject = "PRJ" }
links = [
  ["CResponse", "tasks", "Task", "response", "oneToMany"],
  ["CResponse", "projects", "CProject", "response", "oneToMany"],
  ["CProject", "tasks", "Task", "project", "oneToMany"],
  ["CProject", "lead", "User", "leadOfProjects", "manyToOne"],
  ["CResponse", "lead", "User", "leadOfResponses", "manyToOne"],
  ["COrganisation", "accounts", "Account", "organisation", "oneToMany"],
  ["CProject", "leadAgency", "Account", "clustersLed", "manyToOne"],
  ["CProject", "coLeads", "Account", "clustersCoLed", "manyToMany"],
  ["CProject", "clusterContacts", "CClusterContact", "project", "oneToMany"],
  ["CClusterContact", "account", "Account", "clusterRoles", "manyToOne"],
  ["CClusterContact", "organisation", "COrganisation", "clusterRoles", "manyToOne"],
  ["CClusterContact", "contact", "Contact", "clusterRoles", "manyToOne"],
]
link_labels = { coLeads = "Co-leads", clustersCoLed = "Clusters co-led" }

[settings]
assignment_notifications = ["CResponse", "CProject"]
global_search = ["CResponse", "CProject"]

[entities.Response]
labelPlural = "Responses"
iconClass = "fas fa-house-damage"
[entities.Response.fields]
status = { type = "enum", options = ["Planning", "Active", "Closed"], default = "Planning", style = { Active = "success", Closed = "info" } }
emergencyType = { type = "enum", label = "Emergency type", options = ["", "Earthquake", "Flood", "Cyclone", "Drought", "Conflict", "Epidemic", "Other"] }
country = { type = "varchar" }
startDate = { type = "date", label = "Start date" }
endDate = { type = "date", label = "End date" }

[entities.Project]
label = "Cluster project"
labelPlural = "Cluster projects"
iconClass = "fas fa-layer-group"
[entities.Project.fields]
cluster = { label = "Sector", list = "fivew-melissa.sectors" }
# Activated per response, only those needed, and deactivated later (UNDAC Handbook A.3.2);
# the stored values stay Planning, Active, Closed
status = { type = "enum", options = ["Planning", "Active", "Closed"], translatedOptions = { Planning = "Planning", Active = "Activated", Closed = "Deactivated" }, default = "Planning", style = { Active = "success", Closed = "info" } }
startDate = { type = "date", label = "Start date" }
endDate = { type = "date", label = "End date" }
approach = { type = "enum", options = ["cluster", "sector"], translatedOptions = { cluster = "Cluster (a lead agency leads)", sector = "Sector (the government leads)" }, default = "cluster", tooltipText = "Who leads: in the sector approach the government leads and the agency co-leads (UNDAC Handbook A.3.4)" }
sectorKind = { type = "enum", label = "Kind", options = ["", "cluster", "aor", "working_group", "coordination", "other"], translatedOptions = { cluster = "Cluster", aor = "Area of responsibility (Protection)", working_group = "Working group", coordination = "Coordination", other = "Other" }, readOnly = true, tooltipText = "From the sector" }

# A cluster's people who don't sign in, each with their role in it (its coordinator, IMO,
# government focal point...): their organisation from the list (everyone reads it) or typed
# in (a ministry), its Account found or made (account_from_organisation), and the person a
# Contact on it (find_or_make_contact). People who sign in are users in the cluster's team.
[entities.ClusterContact]
label = "Cluster contact"
labelPlural = "Cluster contacts"
iconClass = "fas fa-address-book"
stream = false
[entities.ClusterContact.fields]
role = { type = "enum", options = ["coordinator", "co_coordinator", "imo", "government_focal_point", "other"], translatedOptions = { coordinator = "Coordinator", co_coordinator = "Co-coordinator", imo = "Information management officer", government_focal_point = "Government focal point", other = "Other" }, default = "coordinator" }
emailAddress = { type = "varchar", label = "Email", maxLength = 150 }
phone = { type = "varchar", maxLength = 40 }
jobTitle = { type = "varchar", label = "Job title" }
organisationOther = { type = "varchar", label = "Organisation (not in the list)" }

# The organisations list's type, and an organisation, once, whatever the response: an
# Account (a 5W registration's or an assessment's formula finds or makes it, the trait
# account_from_organisation; plans/fivew-organisations-plan.md)
[fields.COrganisation]
orgType = { label = "Type", list = "fivew-melissa.org_types" }

[fields.Account]
acronym = { type = "varchar", maxLength = 30 }
orgType = { label = "Type", list = "fivew-melissa.org_types" }

[roles."Internal Staff"]
[roles."Internal Staff".data]
CResponse = { create = "yes", read = "team", edit = "team", delete = "no", stream = "team" }
CProject = { create = "yes", read = "team", edit = "team", delete = "no", stream = "team" }
CClusterContact = { create = "yes", read = "team", edit = "team", delete = "yes", stream = "team" }

[roles."Cluster Lead"]
assignmentPermission = "team"
userPermission = "team"
mentionPermission = "team"
exportPermission = "no"
massUpdatePermission = "no"
