# Workflow F (plans/cso-mapping-plan.md). Generated by kobo/forms/cso.py with its form,
# kobo/forms/cso-profile.json: change them there.
[bridge]
user = "kobo-cso-profile"
role = "Kobo cso-profile"
secret = "ESPO_CSO_PROFILE_API_KEY"

[form]
name = "CSO profile (espo-kobo test)"

# A CSO's profile (CCso). Sent again from the link in its email (its code and key), it
# updates the same CSO; its places and focal points are the new submission's.
[record]
entity = "CCso"
panel = "Profile"
name = "{cso_name}"
match = { code = "cso" }
required = ["cso_name", "cso_type", "sharing"]

[[field]]
kobo = "key"
espo = "keyGiven"

[[field]]
kobo = "acronym"
espo = "acronym"

[[field]]
kobo = "cso_type"
espo = "csoType"

[[field]]
kobo = "cso_type_other"
espo = "csoTypeOther"

[[field]]
kobo = "identity"
espo = "identities"
type = "multiEnum"

[[field]]
kobo = "country_registered"
espo = "countryRegistered"

[[field]]
kobo = "other_countries"
espo = "otherCountries"
type = "multiEnum"

[[field]]
kobo = "levels"
espo = "levels"
type = "multiEnum"

[[field]]
kobo = "sharing"
espo = "sharing"

[[field]]
kobo = "settings"
espo = "settings"
type = "multiEnum"

[[field]]
kobo = "settings_other"
espo = "settingsOther"

[[field]]
kobo = "populations"
espo = "populations"
type = "multiEnum"

[[field]]
kobo = "populations_other"
espo = "populationsOther"

[[field]]
kobo = "stages"
espo = "stages"
type = "multiEnum"

[[field]]
kobo = "roles"
espo = "roles"
type = "multiEnum"

[[field]]
kobo = "roles_other"
espo = "rolesOther"

[[field]]
kobo = "hazards"
espo = "hazards"
type = "multiEnum"

[[field]]
kobo = "hazards_other"
espo = "hazardsOther"

[[field]]
kobo = "roles_with_support"
espo = "rolesWithSupport"
type = "multiEnum"

[[field]]
kobo = "roles_with_support_other"
espo = "rolesWithSupportOther"

[[field]]
kobo = "mechanisms"
espo = "mechanisms"
type = "multiEnum"

[[field]]
kobo = "mechanisms_other"
espo = "mechanismsOther"

[[field]]
kobo = "offers"
espo = "offers"
type = "multiEnum"

[[field]]
kobo = "offers_other"
espo = "offersOther"

[[field]]
kobo = "seeks"
espo = "seeks"
type = "multiEnum"

[[field]]
kobo = "seeks_other"
espo = "seeksOther"

[[field]]
kobo = "connect_via"
espo = "connectVia"
type = "multiEnum"

[[field]]
kobo = "connect_via_other"
espo = "connectViaOther"

[[repeat]]
group = "FOCAL_POINTS"
entity = "CFocalPoint"
link = "cso"
name = "{name}"

[[repeat.field]]
kobo = "email"
espo = "emailAddress"

[[repeat.field]]
kobo = "phone"
espo = "phone"

[[repeat.field]]
kobo = "position"
espo = "jobTitle"

[[repeat]]
group = "PRESENCE"
entity = "CPresence"
link = "cso"
name = "{cso_name}"  # then the place's (formula)

[[repeat.field]]
kobo = "country"
espo = "country"

[[repeat.field]]  # as numbers, for the P-coding step and the maps
kobo = "location"
latitude = "latitude"
longitude = "longitude"
