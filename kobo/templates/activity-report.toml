# Workflow E (plans/workflow-e-5w-plan.md): a 5W activity report, our form modelled on the
# Hurricane Melissa 5W form with its codes (kobo/forms/melissa.py). One submission is one
# Activity (who, what, when, with what), linked to its response, organisations by their
# ORG_ codes, and through its sector to the response's project (formula). Each row of its
# FIGURES_COMMUNITY repeat is an Activity location (parish and community by P-code, the
# people by group, targeted and reached); each FOCAL_POINTS row a Focal point. Organisations
# not in the list become a task for the response's lead.

[bridge]
user = "kobo-activities"
role = "Kobo activities"
secret = "ESPO_ACTIVITIES_API_KEY"

[form]
name = "5W activity report (espo-kobo test)"

[record]
entity = "CActivity"
panel = "Report"
name = "{activity_type}"
required = ["response", "LeadOrganization_name", "sector", "activity_type", "activity_Status", "start_date"]

[[field]]
kobo = "response"
espo = "response"
type = "link"
entity = "CResponse"
lookup = "code"

[[field]]
kobo = "LeadOrganization_name"
espo = "leadOrganisation"
type = "link"
entity = "COrganisation"
lookup = "code"

[[field]]
kobo = "LeadOrganization_name_2"
espo = "leadOrganisationOther"

[[field]]
kobo = "ImplementingOrganization_name"
espo = "implementingOrganisation"
type = "link"
entity = "COrganisation"
lookup = "code"

[[field]]
kobo = "ImplementingOrganization_name_2"
espo = "implementingOrganisationOther"

[[field]]
kobo = "sector"
espo = "sector"

[[field]]
kobo = "scetor_2"
espo = "sectorOther"

[[field]]
kobo = "activity_type"
espo = "activityType"

[[field]]
kobo = "activity_type_other"
espo = "activityTypeOther"

[[field]]
kobo = "activity_title"
espo = "title"

[[field]]
kobo = "activity_Status"
espo = "status"

[[field]]
kobo = "comments"
espo = "comments"

[[field]]
kobo = "URL_to_important_resources"
espo = "resourceUrl"

[[field]]
kobo = "resource_type"
espo = "resourceType"

[[field]]
kobo = "resource_type_other"
espo = "resourceTypeOther"

[[field]]
kobo = "resource_unit_type"
espo = "resourceUnit"

[[field]]
kobo = "resource_unit_type_other"
espo = "resourceUnitOther"

[[field]]
kobo = "start_date"
espo = "startDate"

[[field]]
kobo = "end_date"
espo = "endDate"

[[field]]
kobo = "today"
espo = "reportDate"

# One record per community, and per focal point
[[repeat]]
group = "FIGURES_COMMUNITY"
entity = "CActivityLocation"
