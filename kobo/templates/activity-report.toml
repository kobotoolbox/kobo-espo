# EspoCRM's lists on the form: the responses, the organisations (by type, as the Melissa
# form filters them) and the country's parishes and communities
[[list]]
file = "responses.csv"
entity = "CResponse"
where = { status = ["Planning", "Active"] }
order_by = "name"
columns = { name = "code", label = "name" }
forms = ["5W activity report (espo-kobo test)"]

[[list]]
file = "organisations.csv"
entity = "COrganisation"
order_by = "name"
columns = { name = "code", label = "name", org_type = "orgType" }
forms = ["5W activity report (espo-kobo test)"]

[[list]]
file = "areas.csv"
entity = "CAdminArea"
order_by = "pcode"
columns = { name = "pcode", label = "name", level = "level", parent = "parentPcode" }
forms = ["5W activity report (espo-kobo test)"]
