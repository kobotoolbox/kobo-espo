# The assessment registry (plans/assessment-registry-plan.md). Generated by
# kobo/forms/assessment.py with its form, kobo/forms/assessment-registration.json: change them there.
[bridge]
user = "kobo-assessment-registration"
role = "Kobo assessment-registration"
secret = "ESPO_ASSESSMENT_REGISTRATION_API_KEY"

[form]
name = "Assessment registration (espo-kobo test)"

# An assessment (CAssessment); sent again with its code (in its link), the same one. Its
# teams (the whole response's), its organisation's Account, overlaps: formula
[record]
entity = "CAssessment"
panel = "Assessment"
name = "{title}"
match = { code = "assessment" }
media = "files"
keep_on_update = []  # its status: what the form says
required = ["response", "organisation", "title", "sectors", "start_date", "geo_level", "status"]

[requester]  # who registered it: a Contact, by email
email = "reporter_email"
name = "reporter_name"
create_account = false

[[field]]
kobo = "response"
espo = "response"
type = "link"
entity = "CResponse"
lookup = "code"

[[field]]
kobo = "organisation"
espo = "organisation"
type = "link"
entity = "COrganisation"
lookup = "code"

[[field]]
kobo = "organisation_other"
espo = "organisationOther"

[[field]]
kobo = "sectors"
espo = "sectors"
type = "multiEnum"

[[field]]
kobo = "sectors_other"
espo = "sectorsOther"

[[field]]
kobo = "coordination"
espo = "coordination"

[[field]]
kobo = "methodology"
espo = "methodology"
type = "multiEnum"

[[field]]
kobo = "methodology_other"
espo = "methodologyOther"

[[field]]
kobo = "frequency"
espo = "frequency"

[[field]]
kobo = "frequency_other"
espo = "frequencyOther"

[[field]]
kobo = "lead_organisation"
espo = "leadOrganisation"
type = "link"
entity = "COrganisation"
lookup = "code"

[[field]]
kobo = "lead_organisation_other"
espo = "leadOrganisationOther"

[[field]]
kobo = "participants"
espo = "participantCodes"

[[field]]
kobo = "participants_other"
espo = "participantsOther"

[[field]]
kobo = "start_date"
espo = "startDate"

[[field]]
kobo = "end_date"
espo = "endDate"

[[field]]
kobo = "geo_level"
espo = "geoLevel"

[[field]]
kobo = "area_codes"
espo = "areaCodes"

[[field]]
kobo = "localities"
espo = "localities"

[[field]]
kobo = "status"
espo = "status"

[[field]]
kobo = "report"
espo = "reportFile"

[[field]]
kobo = "report_sharing"
espo = "reportSharing"

[[field]]
kobo = "report_link"
espo = "reportLink"

[[field]]
kobo = "dataset"
espo = "datasetFile"

[[field]]
kobo = "data_sharing"
espo = "dataSharing"

[[field]]
kobo = "notes"
espo = "notes"

# Each area it covers: one row (CAssessmentArea), its area by the deepest P-code given
[[repeat]]
group = "AREAS"
entity = "CAssessmentArea"
link = "assessment"
name = "{area}"  # then its assessment's code and the area's name (formula)

[[repeat.field]]
kobo = "area"
espo = "adminArea"
type = "link"
entity = "CAdminArea"
lookup = "pcode"

[[repeat.field]]
kobo = "area"
espo = "pcode"

[[list]]
file = "responses.csv"
entity = "CResponse"
where = { status = ["Planning", "Active"] }
order_by = "name"
columns = { name = "code", label = "name" }
forms = ["Assessment registration (espo-kobo test)"]

[[list]]
file = "organisations.csv"
entity = "COrganisation"
order_by = "name"
columns = { name = "code", label = "name" }
forms = ["Assessment registration (espo-kobo test)"]

[[list]]
file = "areas.csv"
entity = "CAdminArea"
where = { country = "JAM" }
order_by = "pcode"
columns = { name = "pcode", label = "name", level = "level", parent = "parentPcode" }
forms = ["Assessment registration (espo-kobo test)"]
