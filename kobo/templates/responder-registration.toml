# Workflow E (plans/workflow-e-5w-plan.md): an organisation registers as responding in a
# response, for the sectors it works in. It becomes a Responding organisation (CResponder),
# linked to the organisation in EspoCRM's list (organisations.csv, the 5W form's ORG_
# codes, by type) and its focal point's Contact, in the teams of the response and of the
# response's projects in those sectors (formula). Registering again for the same response
# and organisation updates it. The response is picked by its code from responses.csv.

[bridge]
user = "kobo-responders"
role = "Kobo responders"
secret = "ESPO_RESPONDERS_API_KEY"

[form]
name = "Responding organisation registration (espo-kobo test)"

[record]
entity = "CResponder"
panel = "Registration"
name = "{organisation}"  # then the organisation's name (formula)
match = { registrationKey = "registration_key" }
required = ["response", "organisation", "sectors", "focal_email"]

[requester]  # the focal point's Contact, by email
email = "focal_email"
name = "focal_name"

[[field]]  # by its code (RSP-...), as the list gives it
kobo = "response"
espo = "response"
type = "link"
entity = "CResponse"
lookup = "code"

[[field]]  # by its ORG_ code, as the list gives it
kobo = "organisation"
espo = "organisation"
type = "link"
entity = "COrganisation"
lookup = "code"

[[field]]
kobo = "organisation_other"
espo = "organisationOther"

[[field]]
kobo = "org_acronym"
espo = "acronym"

[[field]]
kobo = "org_type"
espo = "orgType"

[[field]]
kobo = "sectors"
espo = "clusters"
type = "multiEnum"

[[field]]  # as the form gives it: the focal point's Contact takes it (formula)
kobo = "focal_phone"
espo = "focalPointPhone"

[[field]]
kobo = "focal_position"
espo = "focalPointPosition"

[[field]]
kobo = "registration_key"
espo = "registrationKey"

[[list]]
file = "responses.csv"
entity = "CResponse"
where = { status = ["Planning", "Active"] }
order_by = "name"
columns = { name = "code", label = "name" }
forms = ["Responding organisation registration (espo-kobo test)"]

[[list]]
file = "organisations.csv"
entity = "COrganisation"
order_by = "name"
columns = { name = "code", label = "name", org_type = "orgType" }
forms = ["Responding organisation registration (espo-kobo test)"]

# Its other focal points: Contacts on the organisation's Account (its formula's), one per
# person and organisation by email, so the same person registered again (or in another
# response) is the same Contact. In the Account's teams (their formula)
[[repeat]]
group = "FOCAL_POINTS"
entity = "Contact"
name = "{name}"
set = { accountId = "@record.account" }
match = { emailAddress = "email", accountId = "@record.account" }

[[repeat.field]]
kobo = "name"
espo = "name"
type = "personName"

[[repeat.field]]
kobo = "email"
espo = "emailAddress"

[[repeat.field]]
kobo = "phone"
espo = "phoneNumber"

[[repeat.field]]
kobo = "position"
espo = "title"
