# Workflow F (plans/cso-mapping-plan.md). Generated by kobo/forms/cso.py with its form,
# kobo/forms/cso-update.json: change them there.
[bridge]
user = "kobo-cso-update"
role = "Kobo cso-update"
secret = "ESPO_CSO_UPDATE_API_KEY"

[form]
name = "CSO update (espo-kobo test)"

# A CSO's update in one place (CCsoUpdate), its CSO by the code in its link (or typed)
[record]
entity = "CCsoUpdate"
panel = "Update"
name = "{cso_code}"  # then the CSO's and the place's (formula)
required = ["cso_code", "roles", "status"]

[[field]]
kobo = "cso_code"
espo = "cso"
type = "link"
entity = "CCso"
lookup = "code"

[[field]]
kobo = "key"
espo = "keyGiven"

[[field]]
kobo = "locality"
espo = "locality"

[[field]]
kobo = "roles"
espo = "roles"
type = "multiEnum"

[[field]]
kobo = "roles_other"
espo = "rolesOther"

[[field]]
kobo = "status"
espo = "status"

[[field]]
kobo = "populations"
espo = "populations"
type = "multiEnum"

[[field]]
kobo = "populations_other"
espo = "populationsOther"

[[field]]
kobo = "facility"
espo = "facility"

[[field]]
kobo = "needs"
espo = "needs"
type = "multiEnum"

[[field]]
kobo = "needs_other"
espo = "needsOther"

[[field]]
kobo = "needs_note"
espo = "needsNote"

[[field]]
kobo = "country"
espo = "country"

[[field]]  # as numbers, for the P-coding step and the maps
kobo = "location"
latitude = "latitude"
longitude = "longitude"
