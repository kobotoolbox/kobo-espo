# EspoCRM as request intake + response tasking hub (see plans/espo-kobo-setup-plan.md).
# Runs on the test droplet (deploy/up.sh) or a laptop (ESPO_SITE_URL=http://localhost:8085,
# no caddy). Passwords come from the secrets file deploy/up.sh writes (not in git).
#
#   db              MariaDB, only on this project's network
#   espocrm         the web app (apache image), behind caddy
#   espocrm-daemon  EspoCRM's scheduled jobs (notifications, emails, cleanup)
#   caddy           TLS for ESPO_HOST (profile `tls`; Let's Encrypt; deploy/Caddyfile)
#   bridge          kobo-espo-bridge, polling Kobo for every connection (profile `bridge`)
#   bridge-mcp      its EspoCRM MCP, at /bridge/mcp (profile `bridge`)
#   agent-runner    the agents set up in EspoCRM (profile `agents`; agents/runner.py)

services:
  db:
    image: mariadb:11.4.13
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${ESPO_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: espocrm
      MARIADB_USER: espocrm
      MARIADB_PASSWORD: ${ESPO_DB_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  espocrm:
    image: espocrm/espocrm:10.0.11-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: db
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: ${ESPO_DB_PASSWORD}
      # Only read on the first start, when EspoCRM installs itself
      ESPOCRM_ADMIN_USERNAME: admin
      ESPOCRM_ADMIN_PASSWORD: ${ESPO_ADMIN_PASSWORD}
      ESPOCRM_SITE_URL: ${ESPO_SITE_URL}
    # EspoCRM 10: these three, not all of /var/www/html (that's the "legacy" layout,
    # which no longer installs)
    volumes:
      - espo-data:/var/www/html/data
      - espo-custom:/var/www/html/custom
      - espo-client-custom:/var/www/html/client/custom
      # Kobo's look (espo/look/, plans/espo-kobo-look-plan.md): a module with the
      # metadata, and the stylesheet, logo and favicon it points to (not :ro: the
      # image's entrypoint chowns custom/ and client/custom/, and stops if it can't)
      - ./espo/look/module:/var/www/html/custom/Espo/Modules/KoboLook
      - ./espo/look/client:/var/www/html/client/custom/kobo-look
    ports: ["127.0.0.1:${ESPO_PORT:-8085}:80"]
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 60s
      interval: 30s
      timeout: 20s
      retries: 5

  espocrm-daemon:
    image: espocrm/espocrm:10.0.11-apache
    restart: unless-stopped
    entrypoint: docker-daemon.sh
    depends_on:
      espocrm:
        condition: service_healthy
    volumes_from:
      - espocrm

  caddy:
    profiles: [tls]
    image: caddy:2.10
    restart: unless-stopped
    command: caddy run --adapter caddyfile --config /etc/caddy/Caddyfile
    environment:
      ESPO_HOST: ${ESPO_HOST}
    ports: ["80:80", "443:443"]
    volumes:
      - caddy:/data
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    # Not published before EspoCRM has installed itself: its /install/ page is open until
    # then, and scanners found it within seconds on the first try
    depends_on:
      espocrm:
        condition: service_healthy

  # kobo-espo-bridge, one service for every Kobo connection, the records in EspoCRM (bridge.py
  # serve; it runs setup itself, as admin, and writes the API keys it makes to the secrets
  # file). kobo/templates are only the first copies of kobo-espo's four (deploy/bridges.sh)
  bridge:
    profiles: [bridge]
    image: python:3.13-slim
    restart: unless-stopped
    command: ["python3", "-I", "-u", "/bridge/bridge.py", "serve"]  # -u: -I ignores PYTHONUNBUFFERED
    working_dir: /bridge
    depends_on:
      espocrm:
        condition: service_healthy
    volumes:
      - /root/kobo-espo-bridge:/bridge:ro
      - /root/kobo-espo-kobo.token:/run/kobo.token:ro
      - /root/kobo-espo-bridge.secrets:/run/bridge.secrets
      - bridge-state:/state
    environment:
      ESPO_URL: http://espocrm
      ESPO_ADMIN_PASSWORD: ${ESPO_ADMIN_PASSWORD}
      KOBO_URL: ${KOBO_URL}
      KOBO_TOKEN_FILE: /run/kobo.token
      BRIDGE_SECRETS: /run/bridge.secrets
      BRIDGE_STATE_DIR: /state
      BRIDGE_POLL_SECONDS: ${BRIDGE_POLL_SECONDS:-30}
      BRIDGE_LIST_MIN_SECONDS: ${BRIDGE_LIST_MIN_SECONDS:-60}

  # kobo-espo-bridge's EspoCRM MCP (espo_mcp/), at https://ESPO_HOST/bridge/mcp: connecting
  # forms from a conversation, next to kobo-mcp. Admins only: signing in with EspoCRM
  # (claude.ai, Claude Desktop), or a key each for Claude Code
  # (docker compose exec bridge-mcp python3 -I espo_mcp/keys.py add <user>)
  bridge-mcp:
    profiles: [bridge]
    build: /root/kobo-espo-bridge/espo_mcp
    restart: unless-stopped
    working_dir: /bridge
    depends_on:
      espocrm:
        condition: service_healthy
    volumes:
      - /root/kobo-espo-bridge:/bridge:ro
      - /root/kobo-espo-kobo.token:/run/kobo.token:ro
      - bridge-state:/state
    environment:
      ESPO_URL: http://espocrm
      ESPO_SITE_URL: https://${ESPO_HOST}
      ESPO_ADMIN_PASSWORD: ${ESPO_ADMIN_PASSWORD}
      KOBO_URL: ${KOBO_URL}
      KOBO_TOKEN_FILE: /run/kobo.token
      MCP_KEYS_FILE: /state/mcp-keys
      MCP_PUBLIC_URL: https://${ESPO_HOST}/bridge
      MCP_CLIENT_IP_HEADER: X-Forwarded-For  # Caddy's: the sign-in page limits attempts per address

  # The agents (plans/espo-agents-plan.md): one runner for every Agent whose runner is "droplet"
  # (deploy/agents.sh starts it with the keys agents/sync.py made)
  agent-runner:
    profiles: [agents]
    image: python:3.13-slim
    restart: unless-stopped
    command: ["sh", "-c", "pip install -q --root-user-action=ignore --disable-pip-version-check anthropic && exec python3 -I -u /agents/runner.py run"]
    depends_on:
      espocrm:
        condition: service_healthy
    volumes:
      - ./agents:/agents:ro
      - /root/kobo-espo-bridge:/bridge:ro
      - /root/kobo-espo-agents.secrets:/run/agents.secrets:ro
    environment:
      ESPO_URL: http://espocrm
      ESPO_SITE_URL: ${ESPO_SITE_URL}
      KOBO_ESPO_BRIDGE_DIR: /bridge
      AGENTS_SECRETS: /run/agents.secrets
      AGENTS_RUNNER: droplet
      AGENTS_LLM: ${AGENTS_LLM:-real}
      AGENTS_POLL_SECONDS: ${AGENTS_POLL_SECONDS:-30}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  db:
  bridge-state:
  espo-data:
  espo-custom:
  espo-client-custom:
  caddy:
